<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida Maluca - GameHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%8E%AE</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0d0d1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            color: white;
            padding: 15px;
        }
        .game-header { text-align: center; margin-bottom: 10px; }
        .game-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.6rem;
            background: linear-gradient(90deg, #4ecdc4, #ffe66d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-container {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 0 50px rgba(78,205,196,0.3);
            max-width: 560px;
            width: 100%;
            position: relative;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            flex-wrap: wrap;
            gap: 5px;
        }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        .stat-label { color: #a0a0a0; }
        .stat-value { color: #4ecdc4; }
        .stat-value.lives { color: #ff6b6b; }
        .stat-value.speed { color: #ffe66d; }
        #gameCanvas {
            display: block;
            border-radius: 10px;
            background: #222;
            border: 2px solid rgba(78,205,196,0.4);
            max-width: 100%;
        }
        .controls { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
        .control-btn {
            padding: 8px 16px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-start { background: linear-gradient(135deg, #4ecdc4, #2d9e96); color: #0d0d1a; }
        .btn-pause { background: linear-gradient(135deg, #ffe66d, #ccbb5a); color: #0d0d1a; }
        .btn-reset { background: linear-gradient(135deg, #ff6b6b, #cc5353); color: white; }
        .control-btn:hover { transform: translateY(-2px); }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .difficulty-selector { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
        .diff-btn {
            padding: 6px 12px;
            font-size: 0.5rem;
            font-family: 'Press Start 2P', cursive;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            color: #a0a0a0;
        }
        .diff-btn.easy { color: #4ecdc4; }
        .diff-btn.medium { color: #ffe66d; }
        .diff-btn.hard { color: #ff6b6b; }
        .diff-btn.active { border-color: currentColor; background: rgba(255,255,255,0.15); }
        .instructions {
            margin-top: 12px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            text-align: center;
        }
        .instructions h3 { font-family: 'Press Start 2P', cursive; font-size: 0.5rem; color: #4ecdc4; margin-bottom: 6px; }
        .key-bindings { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .key-group { text-align: center; }
        .key-group h4 { font-size: 0.5rem; color: #a0a0a0; margin-bottom: 4px; }
        .key {
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
        }
        .game-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 15px;
            z-index: 10;
            padding: 20px;
        }
        .game-overlay.visible { display: flex; }
        .overlay-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .overlay-title.gameover { color: #ff6b6b; }
        .overlay-title.paused { color: #ffe66d; }
        .overlay-stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .overlay-stat { text-align: center; }
        .overlay-stat-value { font-family: 'Press Start 2P', cursive; font-size: 1rem; color: #4ecdc4; margin-bottom: 3px; }
        .overlay-stat-label { color: #a0a0a0; font-size: 0.7rem; }
        .overlay-btn {
            padding: 10px 25px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #4ecdc4, #2d9e96);
            color: #0d0d1a;
            margin: 4px;
            transition: all 0.3s ease;
        }
        .overlay-btn:hover { transform: translateY(-2px); }

        .game-header {
            position: relative;
            padding-left: 100px;
            padding-right: 100px;
        }
        .back-home {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: #a0a0a0;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .back-home:hover {
            background: rgba(255,255,255,0.2);
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-header">
        <a href="../index.html" class="back-home" title="Voltar ao GameHub">🏠 Início</a>
        <h1 class="game-title">CORRIDA MALUCA</h1>
    </div>
    <div class="game-container">
        <div class="stats-bar">
            <div class="stat-item"><span class="stat-label">DIST:</span><span class="stat-value" id="score">0m</span></div>
            <div class="stat-item"><span class="stat-label">MOEDAS:</span><span class="stat-value" id="coins">🪙 0</span></div>
            <div class="stat-item"><span class="stat-label">VELOC:</span><span class="stat-value speed" id="speed">0 km/h</span></div>
            <div class="stat-item"><span class="stat-label">VIDAS:</span><span class="stat-value lives" id="lives">❤❤❤</span></div>
        </div>
        <canvas id="gameCanvas" width="480" height="560"></canvas>
        <div class="game-overlay" id="gameOverOverlay">
            <div class="overlay-title gameover">BATEU DEMAIS!</div>
            <div class="overlay-stats">
                <div class="overlay-stat"><div class="overlay-stat-value" id="finalScore">0m</div><div class="overlay-stat-label">Distância</div></div>
                <div class="overlay-stat"><div class="overlay-stat-value" id="finalCoins">0</div><div class="overlay-stat-label">Moedas</div></div>
            </div>
            <button class="overlay-btn" onclick="resetGame()">CORRER NOVAMENTE</button>
        </div>
        <div class="game-overlay" id="pauseOverlay">
            <div class="overlay-title paused">PAUSADO</div>
            <button class="overlay-btn" onclick="togglePause()">CONTINUAR</button>
        </div>
        <div class="controls">
            <button class="control-btn btn-start" id="startBtn" onclick="startGame()">INICIAR</button>
            <button class="control-btn btn-pause" id="pauseBtn" onclick="togglePause()" disabled>PAUSAR</button>
            <button class="control-btn btn-reset" onclick="resetGame()">RESETAR</button>
            <button class="control-btn btn-reset" id="musicBtn" onclick="toggleMusic()">🔊 MÚSICA</button>
        </div>
        <div class="difficulty-selector">
            <button class="diff-btn easy active" onclick="setDifficulty('easy')">FÁCIL</button>
            <button class="diff-btn medium" onclick="setDifficulty('medium')">MÉDIO</button>
            <button class="diff-btn hard" onclick="setDifficulty('hard')">DIFÍCIL</button>
        </div>
        <div class="instructions">
            <h3>CONTROLES</h3>
            <div class="key-bindings">
                <div class="key-group"><h4>Desviar</h4><span class="key">← →</span></div>
                <div class="key-group"><h4>Acelerar</h4><span class="key">↑</span></div>
                <div class="key-group"><h4>Frear</h4><span class="key">↓</span></div>
                <div class="key-group"><h4>Pausar</h4><span class="key">P</span></div>
            </div>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const coinsEl = document.getElementById('coins');
    const speedEl = document.getElementById('speed');
    const livesEl = document.getElementById('lives');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const ROAD_LEFT = 70, ROAD_RIGHT = 410;
    const LANES = [110, 190, 270, 350];

    const diffConfig = {
        easy: { baseSpeed: 4, traffic: 60, coinRate: 120 },
        medium: { baseSpeed: 6, traffic: 45, coinRate: 90 },
        hard: { baseSpeed: 8, traffic: 30, coinRate: 70 }
    };

    let gs = {
        playing: false, paused: false,
        score: 0, coins: 0, lives: 3, speed: 4,
        difficulty: 'easy', keys: {}
    };

    const player = {
        x: 230, y: 470, w: 40, h: 60,
        tilt: 0, invincible: 0
    };

    let traffic = [], coins = [], nitros = [], particles = [], roadLines = [];
    let spawnTimer = 0, coinTimer = 0, nitroTimer = 0, shakeTime = 0;

    // Inicializar linhas da estrada
    function initRoadLines() {
        roadLines = [];
        for (let i = 0; i < 12; i++) {
            roadLines.push(i * 50);
        }
    }

    document.addEventListener('keydown', e => {
        gs.keys[e.key] = true;
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
        if ((e.key === 'p' || e.key === 'P') && gs.playing) togglePause();
    });
    document.addEventListener('keyup', e => {
        gs.keys[e.key] = false;
    });

    function setDifficulty(d) {
        if (gs.playing) return;
        gs.difficulty = d;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.diff-btn.${d}`).classList.add('active');
    }

    function startGame() {
        if (gs.playing) return;
        gs.playing = true;
        gs.paused = false;
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        hideAllOverlays();
        startMusic();
        gameLoop();
    }

    function togglePause() {
        if (!gs.playing) return;
        gs.paused = !gs.paused;
        if (gs.paused) {
            document.getElementById('pauseOverlay').classList.add('visible');
            pauseBtn.textContent = 'CONTINUAR';
            if (audioCtx) audioCtx.suspend();
        } else {
            document.getElementById('pauseOverlay').classList.remove('visible');
            pauseBtn.textContent = 'PAUSAR';
            if (audioCtx) audioCtx.resume();
            gameLoop();
        }
    }

    function resetGame() {
        gs = { playing: false, paused: false, score: 0, coins: 0, lives: 3,
            speed: diffConfig[gs.difficulty].baseSpeed, difficulty: gs.difficulty, keys: {} };
        traffic = []; coins = []; nitros = []; particles = [];
        player.x = 230; player.tilt = 0; player.invincible = 0;
        spawnTimer = 0; coinTimer = 0; nitroTimer = 0;
        stopMusic();
        initRoadLines();
        updateUI(); hideAllOverlays();
        startBtn.disabled = false; pauseBtn.disabled = true; pauseBtn.textContent = 'PAUSAR';
        draw();
    }

    function hideAllOverlays() {
        document.querySelectorAll('.game-overlay').forEach(o => o.classList.remove('visible'));
    }

    function gameOver() {
        gs.playing = false;
        stopMusic();
        document.getElementById('finalScore').textContent = Math.floor(gs.score) + 'm';
        document.getElementById('finalCoins').textContent = gs.coins;
        document.getElementById('gameOverOverlay').classList.add('visible');
        startBtn.disabled = false; pauseBtn.disabled = true;
        playSound('gameover');
    }

    function updateUI() {
        scoreEl.textContent = Math.floor(gs.score) + 'm';
        coinsEl.textContent = '🪙 ' + gs.coins;
        speedEl.textContent = Math.round(gs.speed * 30) + ' km/h';
        livesEl.textContent = '❤'.repeat(Math.max(0, gs.lives)) + '🖤'.repeat(Math.max(0, 3 - gs.lives));
    }

    function crash() {
        if (player.invincible > 0) return;
        
        // Explosão
        for (let i = 0; i < 20; i++) {
            particles.push({
                x: player.x, y: player.y,
                dx: (Math.random() - 0.5) * 10, dy: (Math.random() - 0.5) * 10,
                r: Math.random() * 5 + 2, color: ['#ff6b6b', '#f97316', '#ffe66d'][i % 3], life: 1
            });
        }
        
        gs.lives--;
        player.invincible = 90; // 1.5s invencível
        shakeTime = 15;
        gs.speed = Math.max(3, gs.speed * 0.5);
        playSound('crash');
        updateUI();
        
        if (gs.lives <= 0) gameOver();
    }

    function update() {
        const cfg = diffConfig[gs.difficulty];
        
        // Aceleração gradual
        if (gs.keys['ArrowUp']) gs.speed += 0.04;
        else if (gs.keys['ArrowDown']) gs.speed -= 0.08;
        else gs.speed += 0.005;
        gs.speed = Math.max(3, Math.min(gs.speed, 16));
        
        // Movimento do jogador
        if (gs.keys['ArrowLeft']) { player.x -= 6; player.tilt = -0.25; }
        else if (gs.keys['ArrowRight']) { player.x += 6; player.tilt = 0.25; }
        else player.tilt *= 0.8;
        
        player.x = Math.max(ROAD_LEFT + player.w/2, Math.min(ROAD_RIGHT - player.w/2, player.x));
        
        if (player.invincible > 0) player.invincible--;
        if (shakeTime > 0) shakeTime--;
        
        // Score por distância
        gs.score += gs.speed * 0.1;
        
        // Linhas da estrada
        roadLines.forEach((l, i) => {
            roadLines[i] = (l + gs.speed * 2) % 560;
        });
        
        // Spawn de tráfego
        spawnTimer++;
        const trafficRate = Math.max(15, cfg.traffic - gs.speed);
        if (spawnTimer > trafficRate) {
            spawnTimer = 0;
            const lane = LANES[Math.floor(Math.random() * LANES.length)];
            traffic.push({
                x: lane, y: -70, w: 42, h: 64,
                speed: 1 + Math.random() * 1.5,
                color: ['#e74c3c', '#3498db', '#9b59b6', '#f39c12', '#1abc9c'][Math.floor(Math.random() * 5)]
            });
        }
        
        // Spawn de moedas
        coinTimer++;
        if (coinTimer > cfg.coinRate) {
            coinTimer = 0;
            coins.push({
                x: LANES[Math.floor(Math.random() * LANES.length)],
                y: -30, r: 12, spin: 0
            });
        }
        
        // Spawn de nitro (raro)
        nitroTimer++;
        if (nitroTimer > 600) {
            nitroTimer = 0;
            nitros.push({
                x: LANES[Math.floor(Math.random() * LANES.length)],
                y: -30, r: 14
            });
        }
        
        // Mover tráfego
        traffic.forEach((t, i) => {
            t.y += gs.speed - t.speed;
            if (t.y > canvas.height + 70) traffic.splice(i, 1);
        });
        
        // Mover moedas
        coins.forEach((c, i) => {
            c.y += gs.speed;
            c.spin += 0.1;
            if (c.y > canvas.height + 30) coins.splice(i, 1);
        });
        
        // Mover nitros
        nitros.forEach((n, i) => {
            n.y += gs.speed;
            if (n.y > canvas.height + 30) nitros.splice(i, 1);
        });
        
        // Colisão tráfego
        traffic.forEach((t, i) => {
            if (player.x - player.w/2 < t.x + t.w/2 &&
                player.x + player.w/2 > t.x - t.w/2 &&
                player.y - player.h/2 < t.y + t.h/2 &&
                player.y + player.h/2 > t.y - t.h/2) {
                traffic.splice(i, 1);
                crash();
            }
        });
        
        // Colisão moedas
        coins.forEach((c, i) => {
            if (Math.hypot(c.x - player.x, c.y - player.y) < c.r + 25) {
                coins.splice(i, 1);
                gs.coins++;
                gs.score += 50;
                playSound('coin');
                updateUI();
            }
        });
        
        // Colisão nitro
        nitros.forEach((n, i) => {
            if (Math.hypot(n.x - player.x, n.y - player.y) < n.r + 25) {
                nitros.splice(i, 1);
                gs.speed = Math.min(gs.speed + 4, 18);
                playSound('nitro');
            }
        });
        
        // Partículas
        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.x += p.dx; p.y += p.dy; p.life -= 0.03; p.r *= 0.97; });
        
        updateUI();
    }

    function drawCar(x, y, w, h, color, tilt = 0) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(tilt);
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
        
        // Corpo
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(-w/2, -h/2, w, h, 8);
        ctx.fill();
        
        // Vidro
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(135, 206, 235, 0.8)';
        ctx.beginPath();
        ctx.roundRect(-w/2 + 6, -h/2 + 10, w - 12, h * 0.28, 4);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(-w/2 + 6, h/2 - 20, w - 12, h * 0.2, 4);
        ctx.fill();
        
        // Faróis
        ctx.fillStyle = '#fff9c4';
        ctx.fillRect(-w/2 + 4, -h/2 - 2, 8, 4);
        ctx.fillRect(w/2 - 12, -h/2 - 2, 8, 4);
        
        ctx.restore();
        ctx.shadowBlur = 0;
    }

    function draw() {
        ctx.save();
        if (shakeTime > 0) {
            ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
        }
        
        // Grama
        ctx.fillStyle = '#0d2818';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Estrada
        ctx.fillStyle = '#2b2b2b';
        ctx.fillRect(ROAD_LEFT, 0, ROAD_RIGHT - ROAD_LEFT, canvas.height);
        
        // Bordas
        ctx.fillStyle = '#ffe66d';
        ctx.fillRect(ROAD_LEFT - 6, 0, 6, canvas.height);
        ctx.fillRect(ROAD_RIGHT, 0, 6, canvas.height);
        
        // Linhas centrais
        ctx.fillStyle = 'rgba(255,255,255,0.4)';
        roadLines.forEach(l => {
            ctx.fillRect(150, l, 4, 25);
            ctx.fillRect(230, l, 4, 25);
            ctx.fillRect(310, l, 4, 25);
        });
        
        // Moedas
        coins.forEach(c => {
            const scaleX = Math.abs(Math.cos(c.spin));
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffd700';
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.ellipse(c.x, c.y, c.r * scaleX + 2, c.r, 0, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#b8860b';
            ctx.font = 'bold 12px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            if (scaleX > 0.4) ctx.fillText('$', c.x, c.y);
        });
        
        // Nitros
        nitros.forEach(n => {
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#00ffff';
            ctx.fillStyle = '#00ffff';
            ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#0d0d1a';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('N', n.x, n.y);
        });
        
        // Tráfego
        traffic.forEach(t => drawCar(t.x, t.y, t.w, t.h, t.color));
        
        // Player (pisca se invencível)
        if (player.invincible === 0 || Math.floor(player.invincible / 5) % 2 === 0) {
            // Rastro de nitro visual quando rápido
            if (gs.speed > 10) {
                ctx.fillStyle = 'rgba(255, 119, 0, 0.4)';
                ctx.beginPath();
                ctx.ellipse(player.x, player.y + 40, 12, 18, 0, 0, Math.PI*2);
                ctx.fill();
            }
            drawCar(player.x, player.y, player.w, player.h, '#4ecdc4', player.tilt);
        }
        
        // Partículas
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.restore();
    }

    function gameLoop() {
        if (!gs.playing || gs.paused) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Som
    const AC = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AC(); }
    function playSound(type) {
        initAudio();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        const sounds = {
            crash: { f: 120, t: 'sawtooth', v: 0.25 },
            coin: { f: 1200, t: 'sine', v: 0.1 },
            nitro: { f: 400, t: 'square', v: 0.15 },
            gameover: { f: 100, t: 'sawtooth', v: 0.25 }
        };
        const s = sounds[type] || sounds.coin;
        o.frequency.value = s.f; o.type = s.t; g.gain.value = s.v;
        o.start(); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        o.stop(audioCtx.currentTime + 0.2);
    }

    // ==================== TRILHA SONORA DE CORRIDA ====================
    let musicOn = true;
    let musicMaster = null;
    let musicIntervals = [];
    let seqStep = 0;
    let noiseBuffer = null;

    function getNoise() {
        if (!noiseBuffer) {
            noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.1, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        }
        return noiseBuffer;
    }

    function startMusic() {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        stopMusic();
        if (!musicOn) return;

        musicMaster = audioCtx.createGain();
        musicMaster.gain.value = 0.55;
        musicMaster.connect(audioCtx.destination);

        // Sequenciador: 132 BPM, semicolcheias (~113ms)
        const bassLine = [55, 55, 82.41, 55, 65.41, 55, 73.42, 61.74]; // A1, E2, C2, D2, B1

        musicIntervals.push(setInterval(() => {
            if (!gs.playing || gs.paused || !musicOn || !audioCtx) return;
            const step = seqStep % 16;
            const now = audioCtx.currentTime;

            // Bass: groove pulsante
            if (step % 2 === 0) {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(musicMaster);
                o.type = 'sawtooth';
                o.frequency.value = bassLine[Math.floor(step / 2) % bassLine.length];
                g.gain.setValueAtTime(0.09, now);
                g.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                o.start(); o.stop(now + 0.2);
            }

            // Kick: batida 4x4
            if (step % 4 === 0) {
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.connect(g); g.connect(musicMaster);
                o.type = 'sine';
                o.frequency.setValueAtTime(150, now);
                o.frequency.exponentialRampToValueAtTime(45, now + 0.1);
                g.gain.setValueAtTime(0.16, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                o.start(); o.stop(now + 0.15);
            }

            // Hi-hat: colcheias alternadas
            if (step % 2 === 1) {
                const src = audioCtx.createBufferSource();
                src.buffer = getNoise();
                const f = audioCtx.createBiquadFilter();
                f.type = 'highpass'; f.frequency.value = 7000;
                const g = audioCtx.createGain();
                src.connect(f); f.connect(g); g.connect(musicMaster);
                g.gain.setValueAtTime(0.035, now);
                g.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                src.start(); src.stop(now + 0.05);
            }

            // Lead: riff de subida a cada 2 compassos
            if (step === 12 && Math.floor(seqStep / 16) % 2 === 1) {
                const riff = [440, 523.25, 659.25, 880];
                riff.forEach((f, i) => {
                    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.connect(g); g.connect(musicMaster);
                    o.type = 'square';
                    o.frequency.value = f;
                    g.gain.setValueAtTime(0.05, now + i * 0.09);
                    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.12);
                    o.start(now + i * 0.09); o.stop(now + i * 0.09 + 0.13);
                });
            }

            seqStep++;
        }, 113));
    }

    function stopMusic() {
        musicIntervals.forEach(clearInterval);
        musicIntervals = [];
        if (musicMaster) {
            try { musicMaster.disconnect(); } catch (e) {}
            musicMaster = null;
        }
    }

    function toggleMusic() {
        musicOn = !musicOn;
        document.getElementById('musicBtn').textContent = musicOn ? '🔊 MÚSICA' : '🔇 MUDO';
        if (musicOn && gs.playing) startMusic();
        else stopMusic();
    }

    initRoadLines();
    updateUI();
    draw();
    </script>
</body>
