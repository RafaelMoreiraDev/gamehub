<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasores Espaciais - GameHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Roboto', sans-serif;
            color: white;
            padding: 15px;
        }
        .game-header { text-align: center; margin-bottom: 10px; }
        .game-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.6rem;
            background: linear-gradient(90deg, #00ff88, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .game-container {
            background: rgba(0,0,0,0.5);
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 0 50px rgba(0,255,136,0.3);
            max-width: 650px;
            width: 100%;
            position: relative;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            flex-wrap: wrap;
            gap: 5px;
        }
        .stat-item { display: flex; align-items: center; gap: 4px; }
        .stat-label { color: #a0a0a0; }
        .stat-value { color: #00ff88; }
        .stat-value.lives { color: #ff6b6b; }
        .stat-value.level { color: #ffe66d; }
        .stat-value.boss { color: #ff00ff; }
        #gameCanvas {
            display: block;
            border-radius: 10px;
            background: #0a0a1a;
            border: 2px solid rgba(0,255,136,0.3);
            max-width: 100%;
        }
        .powerup-bar {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .powerup-indicator {
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.55rem;
            font-family: 'Press Start 2P', cursive;
            display: none;
        }
        .powerup-indicator.active { display: flex; align-items: center; gap: 4px; }
        .powerup-indicator.triple { background: rgba(0,255,255,0.3); color: #00ffff; }
        .powerup-indicator.speed { background: rgba(255,230,109,0.3); color: #ffe66d; }
        .powerup-indicator.shield { background: rgba(100,200,255,0.3); color: #64c8ff; }
        .powerup-indicator.rapid { background: rgba(255,107,107,0.3); color: #ff6b6b; }
        .controls {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .control-btn {
            padding: 8px 16px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-start { background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a1a; }
        .btn-pause { background: linear-gradient(135deg, #ffe66d, #ccbb5a); color: #0a0a1a; }
        .btn-reset { background: linear-gradient(135deg, #ff6b6b, #cc5353); color: white; }
        .control-btn:hover { transform: translateY(-2px); }
        .control-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .difficulty-selector {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }
        .diff-btn {
            padding: 6px 12px;
            font-size: 0.5rem;
            font-family: 'Press Start 2P', cursive;
            border: 2px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            color: #a0a0a0;
        }
        .diff-btn.easy { color: #00ff88; }
        .diff-btn.medium { color: #ffe66d; }
        .diff-btn.hard { color: #ff6b6b; }
        .diff-btn.active { border-color: currentColor; background: rgba(255,255,255,0.15); }
        .instructions {
            margin-top: 12px;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            text-align: center;
        }
        .instructions h3 { font-family: 'Press Start 2P', cursive; font-size: 0.5rem; color: #00ff88; margin-bottom: 6px; }
        .key-bindings { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .key-group { text-align: center; }
        .key-group h4 { font-size: 0.5rem; color: #a0a0a0; margin-bottom: 4px; }
        .keys { display: flex; gap: 4px; justify-content: center; }
        .key {
            background: rgba(255,255,255,0.1);
            padding: 4px 8px;
            border-radius: 5px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.5rem;
        }
        .game-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 15px;
            z-index: 10;
            padding: 20px;
        }
        .game-overlay.visible { display: flex; }
        .overlay-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
        }
        .overlay-title.gameover { color: #ff6b6b; }
        .overlay-title.victory { color: #00ff88; }
        .overlay-title.paused { color: #ffe66d; }
        .overlay-title.boss { color: #ff00ff; }
        .overlay-stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .overlay-stat { text-align: center; }
        .overlay-stat-value { font-family: 'Press Start 2P', cursive; font-size: 1rem; color: #00ffff; margin-bottom: 3px; }
        .overlay-stat-label { color: #a0a0a0; font-size: 0.7rem; }
        .overlay-btn {
            padding: 10px 25px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #0a0a1a;
            margin: 4px;
            transition: all 0.3s ease;
        }
        .overlay-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,255,136,0.4); }
        .level-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Press Start 2P', cursive;
            font-size: 1.5rem;
            color: #ffe66d;
            text-shadow: 0 0 30px #ffe66d;
            pointer-events: none;
            opacity: 0;
            z-index: 5;
            text-align: center;
        }
        .level-info.show {
            animation: levelFade 2s ease forwards;
        }
        @keyframes levelFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .game-header {
            position: relative;
        }
        .back-home {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: #a0a0a0;
            padding: 7px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .back-home:hover {
            background: rgba(255,255,255,0.2);
            color: white;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-header">
        <a href="../index.html" class="back-home" title="Voltar ao GameHub">🏠 Início</a>
        <h1 class="game-title">INVASORES ESPACIAIS</h1>
    </div>
    <div class="game-container">
        <div class="stats-bar">
            <div class="stat-item"><span class="stat-label">SCORE:</span><span class="stat-value" id="score">0</span></div>
            <div class="stat-item"><span class="stat-label">NÍVEL:</span><span class="stat-value level" id="level">1</span></div>
            <div class="stat-item"><span class="stat-label">VIDAS:</span><span class="stat-value lives" id="lives">❤❤❤</span></div>
            <div class="stat-item" id="bossHpContainer" style="display:none"><span class="stat-label">CHEFE:</span><span class="stat-value boss" id="bossHp">██████</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="420"></canvas>
        <div class="powerup-bar">
            <span class="powerup-indicator triple" id="puTriple">🔫 TRIPLE</span>
            <span class="powerup-indicator speed" id="puSpeed">👟 SPEED</span>
            <span class="powerup-indicator shield" id="puShield">🛡️ SHIELD</span>
            <span class="powerup-indicator rapid" id="puRapid">⚡ RAPID</span>
        </div>
        <div class="level-info" id="levelInfo"></div>
        <div class="game-overlay" id="gameOverOverlay">
            <div class="overlay-title gameover">GAME OVER</div>
            <div class="overlay-stats">
                <div class="overlay-stat"><div class="overlay-stat-value" id="finalScore">0</div><div class="overlay-stat-label">Pontos</div></div>
                <div class="overlay-stat"><div class="overlay-stat-value" id="finalLevel">1</div><div class="overlay-stat-label">Nível</div></div>
            </div>
            <button class="overlay-btn" onclick="resetGame()">JOGAR NOVAMENTE</button>
        </div>
        <div class="game-overlay" id="levelCompleteOverlay">
            <div class="overlay-title victory">NÍVEL COMPLETO!</div>
            <div class="overlay-stats">
                <div class="overlay-stat"><div class="overlay-stat-value" id="completeScore">0</div><div class="overlay-stat-label">Pontos</div></div>
                <div class="overlay-stat"><div class="overlay-stat-value" id="completeLevel">1</div><div class="overlay-stat-label">Nível</div></div>
            </div>
            <button class="overlay-btn" onclick="nextLevel()">PRÓXIMO NÍVEL →</button>
        </div>
        <div class="game-overlay" id="victoryOverlay">
            <div class="overlay-title victory">🎉 VITÓRIA TOTAL! 🎉</div>
            <div class="overlay-stats">
                <div class="overlay-stat"><div class="overlay-stat-value" id="victoryScore">0</div><div class="overlay-stat-label">Pontos Finais</div></div>
            </div>
            <p style="color:#a0a0a0;text-align:center;margin-bottom:15px;font-size:0.8rem;">Parabéns! Você salvou a galáxia!</p>
            <button class="overlay-btn" onclick="resetGame()">JOGAR NOVAMENTE</button>
        </div>
        <div class="game-overlay" id="pauseOverlay">
            <div class="overlay-title paused">PAUSADO</div>
            <button class="overlay-btn" onclick="togglePause()">CONTINUAR</button>
        </div>
        <div class="controls">
            <button class="control-btn btn-start" id="startBtn" onclick="startGame()">INICIAR</button>
            <button class="control-btn btn-pause" id="pauseBtn" onclick="togglePause()" disabled>PAUSAR</button>
            <button class="control-btn btn-reset" onclick="resetGame()">RESETAR</button>
        </div>
        <div class="difficulty-selector">
            <button class="diff-btn easy active" onclick="setDifficulty('easy')">FÁCIL</button>
            <button class="diff-btn medium" onclick="setDifficulty('medium')">MÉDIO</button>
            <button class="diff-btn hard" onclick="setDifficulty('hard')">DIFÍCIL</button>
        </div>
        <div class="instructions">
            <h3>CONTROLES</h3>
            <div class="key-bindings">
                <div class="key-group"><h4>Mover</h4><div class="keys"><span class="key">← →</span></div></div>
                <div class="key-group"><h4>Atirar</h4><div class="keys"><span class="key">ESPAÇO</span></div></div>
                <div class="key-group"><h4>Pausar</h4><div class="keys"><span class="key">P</span></div></div>
            </div>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // DOM
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const bossHpContainer = document.getElementById('bossHpContainer');
    const bossHpEl = document.getElementById('bossHp');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const levelInfo = document.getElementById('levelInfo');

    // Power-up indicators
    const puTriple = document.getElementById('puTriple');
    const puSpeed = document.getElementById('puSpeed');
    const puShield = document.getElementById('puShield');
    const puRapid = document.getElementById('puRapid');

    // Diff config
    const diffConfig = {
        easy: { enemySpd: 1, bulletSpd: 7, spawnRate: 100 },
        medium: { enemySpd: 1.4, bulletSpd: 8, spawnRate: 75 },
        hard: { enemySpd: 1.8, bulletSpd: 9, spawnRate: 55 }
    };

    // Level definitions
    const levels = [
        { name: "Nível 1 - Fronteira Espacial", enemies: 8, spawnRate: 100, types: ["basic"], boss: { hp: 30, name: "Sentinela", color: "#ff6b6b", size: 50 } },
        { name: "Nível 2 - Zona de Guerra", enemies: 12, spawnRate: 85, types: ["basic", "fast"], boss: { hp: 50, name: "Predador", color: "#ffe66d", size: 55 } },
        { name: "Nível 3 - Campo de Batalha", enemies: 15, spawnRate: 70, types: ["basic", "fast", "shooter"], boss: { hp: 70, name: "Devastador", color: "#ff00ff", size: 60 } },
        { name: "Nível 4 - Território Inimigo", enemies: 18, spawnRate: 60, types: ["fast", "shooter", "tank"], boss: { hp: 100, name: "Destruidor", color: "#00ffff", size: 65 } },
        { name: "Nível 5 - Fortaleza", enemies: 22, spawnRate: 50, types: ["shooter", "tank", "fast"], boss: { hp: 130, name: "Guardião", color: "#ff8800", size: 70 } },
        { name: "Nível 6 - Mãe Nave", enemies: 25, spawnRate: 45, types: ["tank", "shooter", "fast"], boss: { hp: 180, name: "RAINHA CÓSMICA", color: "#ff0088", size: 80 } }
    ];

    // Enemy type definitions
    const enemyTypes = {
        basic: { color: '#ff6b6b', hp: 1, speed: 1, points: 10, size: 25, canShoot: false },
        fast: { color: '#ffe66d', hp: 1, speed: 2, points: 15, size: 22, canShoot: false },
        shooter: { color: '#ff00ff', hp: 2, speed: 0.8, points: 25, size: 28, canShoot: true },
        tank: { color: '#00ffff', hp: 3, speed: 0.5, points: 35, size: 32, canShoot: true }
    };

    // Power-up types
    const powerupTypes = [
        { type: 'triple', color: '#00ffff', label: '🔫', duration: 10000 },
        { type: 'speed', color: '#ffe66d', label: '👟', duration: 8000 },
        { type: 'shield', color: '#64c8ff', label: '🛡️', duration: 12000 },
        { type: 'rapid', color: '#ff6b6b', label: '⚡', duration: 8000 },
        { type: 'life', color: '#ff6b6b', label: '❤️', duration: 0 },
        { type: 'bomb', color: '#ff8800', label: '💣', duration: 0 }
    ];

    // Game state
    let gs = {
        playing: false, paused: false, score: 0, lives: 3, level: 0,
        difficulty: 'easy', keys: { left: false, right: false, space: false },
        spawned: 0, totalEnemies: 0, bossActive: false, bossDefeated: false,
        powerups: { triple: 0, speed: 0, shield: 0, rapid: 0 }
    };

    // Objects
    const player = { x: 280, y: 370, w: 40, h: 30, speed: 5, color: '#00ff88' };
    let bullets = [], enemies = [], enemyBullets = [], particles = [], powerups = [], stars = [];
    let boss = null, spawnTimer = 0, shootCooldown = 0, canShoot = true;

    // Init stars
    function initStars() {
        stars = [];
        for (let i = 0; i < 80; i++) {
            stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2+0.5, sp: Math.random()*0.5+0.1 });
        }
    }

    // Keyboard
    document.addEventListener('keydown', e => {
        if (e.key==='ArrowLeft'||e.key==='a') { gs.keys.left=true; }
        if (e.key==='ArrowRight'||e.key==='d') { gs.keys.right=true; }
        if (e.key===' ') { e.preventDefault(); gs.keys.space=true; }
        if ((e.key==='p'||e.key==='P') && gs.playing) togglePause();
    });
    document.addEventListener('keyup', e => {
        if (e.key==='ArrowLeft'||e.key==='a') { gs.keys.left=false; }
        if (e.key==='ArrowRight'||e.key==='d') { gs.keys.right=false; }
        if (e.key===' ') { gs.keys.space=false; }
    });

    function setDifficulty(d) {
        if (gs.playing) return;
        gs.difficulty = d;
        document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.diff-btn.${d}`).classList.add('active');
    }

    function showLevelInfo(text) {
        levelInfo.textContent = text;
        levelInfo.classList.remove('show');
        void levelInfo.offsetWidth;
        levelInfo.classList.add('show');
    }

    function startGame() {
        if (gs.playing) return;
        gs.playing = true;
        gs.paused = false;
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        hideAllOverlays();
        showLevelInfo(levels[gs.level].name);
        setTimeout(() => gameLoop(), 1500);
    }

    function togglePause() {
        if (!gs.playing) return;
        gs.paused = !gs.paused;
        if (gs.paused) {
            document.getElementById('pauseOverlay').classList.add('visible');
            pauseBtn.textContent = 'CONTINUAR';
        } else {
            document.getElementById('pauseOverlay').classList.remove('visible');
            pauseBtn.textContent = 'PAUSAR';
            gameLoop();
        }
    }

    function resetGame() {
        gs = { playing:false, paused:false, score:0, lives:3, level:0, difficulty:gs.difficulty,
            keys:{left:false,right:false,space:false}, spawned:0, totalEnemies:0, bossActive:false, bossDefeated:false,
            powerups:{triple:0,speed:0,shield:0,rapid:0} };
        bullets=[]; enemies=[]; enemyBullets=[]; particles=[]; powerups=[]; boss=null;
        spawnTimer=0; shootCooldown=0; canShoot=true;
        player.x=280; player.speed=5;
        updateUI(); updatePowerupUI(); hideAllOverlays();
        startBtn.disabled=false; pauseBtn.disabled=true; pauseBtn.textContent='PAUSAR';
        draw();
    }

    function hideAllOverlays() {
        document.querySelectorAll('.game-overlay').forEach(o => o.classList.remove('visible'));
    }

    function nextLevel() {
        gs.level++;
        if (gs.level >= levels.length) {
            document.getElementById('victoryScore').textContent = gs.score;
            document.getElementById('victoryOverlay').classList.add('visible');
            gs.playing = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            return;
        }
        gs.spawned=0; gs.bossActive=false; gs.bossDefeated=false; gs.totalEnemies=levels[gs.level].enemies;
        bullets=[]; enemies=[]; enemyBullets=[]; particles=[]; powerups=[]; boss=null;
        spawnTimer=0;
        player.x=280;
        updateUI(); hideAllOverlays();
        showLevelInfo(levels[gs.level].name);
        setTimeout(() => gameLoop(), 1500);
    }

    function gameOver() {
        gs.playing=false;
        document.getElementById('finalScore').textContent=gs.score;
        document.getElementById('finalLevel').textContent=gs.level+1;
        document.getElementById('gameOverOverlay').classList.add('visible');
        startBtn.disabled=false; pauseBtn.disabled=true;
        playSound('gameover');
    }

    function updateUI() {
        scoreEl.textContent=gs.score;
        levelEl.textContent=gs.level+1;
        livesEl.textContent='❤'.repeat(gs.lives)+'🖤'.repeat(Math.max(0,3-gs.lives));
        bossHpContainer.style.display=gs.bossActive?'flex':'none';
        if(boss) {
            const pct=Math.max(0,Math.ceil((boss.hp/boss.maxHp)*6));
            bossHpEl.textContent='█'.repeat(pct)+'░'.repeat(6-pct);
        }
    }

    function updatePowerupUI() {
        puTriple.classList.toggle('active',gs.powerups.triple>Date.now());
        puSpeed.classList.toggle('active',gs.powerups.speed>Date.now());
        puShield.classList.toggle('active',gs.powerups.shield>Date.now());
        puRapid.classList.toggle('active',gs.powerups.rapid>Date.now());
    }

    // Movement
    function movePlayer() {
        const spd = gs.powerups.speed>Date.now() ? player.speed*1.6 : player.speed;
        if(gs.keys.left && player.x>0) player.x-=spd;
        if(gs.keys.right && player.x<canvas.width-player.w) player.x+=spd;
    }

    function shoot() {
        if(!gs.keys.space || !canShoot) return;
        const rapid = gs.powerups.rapid>Date.now();
        shootCooldown = rapid ? 5 : 15;
        canShoot = false;

        const triple = gs.powerups.triple>Date.now();
        if(triple) {
            bullets.push({x:player.x+player.w/2-2, y:player.y, w:4, h:12, spd:8, color:'#00ffff'});
            bullets.push({x:player.x+player.w/2-15, y:player.y+5, w:4, h:12, spd:7, dx:-1.5, color:'#00ffff'});
            bullets.push({x:player.x+player.w/2+11, y:player.y+5, w:4, h:12, spd:7, dx:1.5, color:'#00ffff'});
        } else {
            bullets.push({x:player.x+player.w/2-2, y:player.y, w:4, h:12, spd:8, color:'#00ffff'});
        }
        playSound('shoot');
    }

    // Spawn enemies
    function spawnEnemies() {
        if(gs.bossActive || gs.bossDefeated) return;
        spawnTimer++;
        const lv = levels[gs.level];
        const rate = Math.max(30, lv.spawnRate - gs.level*5);
        if(spawnTimer >= rate && gs.spawned < lv.enemies) {
            spawnTimer=0;
            const typeName = lv.types[Math.floor(Math.random()*lv.types.length)];
            const def = enemyTypes[typeName];
            enemies.push({
                x: Math.random()*(canvas.width-def.size),
                y: -def.size,
                w: def.size, h: def.size,
                hp: def.hp, maxHp: def.hp,
                spd: def.speed * (0.8+gs.level*0.15) * diffConfig[gs.difficulty].enemySpd,
                color: def.color, points: def.points,
                canShoot: def.canShoot, type: typeName,
                dx: Math.random()>0.5?1:-1, shootTimer: Math.floor(Math.random()*60)
            });
            gs.spawned++;
        }
    }

    // Spawn boss
    function spawnBoss() {
        gs.bossActive=true;
        const lv=levels[gs.level];
        const b=lv.boss;
        boss={x:canvas.width/2-b.size/2, y:-b.size-20, w:b.size, h:b.size, hp:b.hp, maxHp:b.hp,
            color:b.color, name:b.name, spd:1.5, dx:1, shootTimer:0, phase:0, phaseTimer:0};
        showLevelInfo('⚠️ CHEFE: '+b.name+' ⚠️');
        playSound('boss');
    }

    // Powerup drop
    function dropPowerup(x,y) {
        if(Math.random()>0.2) return;
        const type = powerupTypes[Math.floor(Math.random()*powerupTypes.length)];
        powerups.push({x:x, y:y, w:20, h:20, spd:2, ...type});
    }

    // Enemy shoot
    function enemyShoot() {
        enemies.forEach(e => {
            if(!e.canShoot) return;
            e.shootTimer--;
            if(e.shootTimer<=0) {
                e.shootTimer = 60+Math.floor(Math.random()*40);
                enemyBullets.push({x:e.x+e.w/2-2, y:e.y+e.h, w:4, h:10, spd:4, color:'#ff6b6b'});
            }
        });
        if(boss && boss.y>0) {
            boss.shootTimer--;
            if(boss.shootTimer<=0) {
                boss.shootTimer = 30;
                boss.phase = (boss.phase+1)%3;
                if(boss.phase===0) {
                    enemyBullets.push({x:boss.x+boss.w/2-2, y:boss.y+boss.h, w:4, h:12, spd:5, color:boss.color});
                } else if(boss.phase===1) {
                    enemyBullets.push({x:boss.x+10, y:boss.y+boss.h, w:4, h:12, spd:4, dx:-1, color:boss.color});
                    enemyBullets.push({x:boss.x+boss.w-14, y:boss.y+boss.h, w:4, h:12, spd:4, dx:1, color:boss.color});
                } else {
                    for(let i=0;i<3;i++) {
                        enemyBullets.push({x:boss.x+10+i*(boss.w-20)/2, y:boss.y+boss.h, w:4, h:12, spd:4, color:boss.color});
                    }
                }
            }
        }
    }

    // Explosion
    function explode(x,y,color,n=15) {
        for(let i=0;i<n;i++) {
            particles.push({x,y, dx:(Math.random()-0.5)*8, dy:(Math.random()-0.5)*8, r:Math.random()*4+2, color, life:1});
        }
    }

    // Collision
    function coll(a,b) {
        return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
    }

    // Check collisions
    function checkCollisions() {
        // Bullets vs enemies
        bullets.forEach((b,bi) => {
            enemies.forEach((e,ei) => {
                if(coll(b,e)) {
                    e.hp--;
                    bullets.splice(bi,1);
                    playSound('hit');
                    if(e.hp<=0) {
                        gs.score+=e.points;
                        explode(e.x+e.w/2,e.y+e.h/2,e.color);
                        dropPowerup(e.x,e.y);
                        enemies.splice(ei,1);
                        playSound('explosion');
                    }
                }
            });
            // Bullets vs boss
            if(boss && coll(b,boss)) {
                bullets.splice(bi,1);
                boss.hp--;
                playSound('hit');
                if(boss.hp<=0) {
                    gs.score+=500;
                    const bx=boss.x, by=boss.y, bw=boss.w, bh=boss.h, bc=boss.color;
                    explode(bx+bw/2,by+bh/2,bc,50);
                    for(let i=0;i<5;i++) {
                        setTimeout(()=>explode(bx+Math.random()*bw,by+Math.random()*bh,bc,10),i*100);
                    }
                    boss=null;
                    gs.bossActive=false;
                    gs.bossDefeated=true;
                    playSound('bosskill');
                    setTimeout(()=>levelComplete(),1500);
                }
                updateUI();
            }
        });

        // Enemy bullets vs player
        enemyBullets.forEach((b,bi) => {
            if(coll(b,player)) {
                enemyBullets.splice(bi,1);
                if(gs.powerups.shield>Date.now()) {
                    explode(player.x+player.w/2,player.y,'#64c8ff',10);
                    playSound('shield');
                } else {
                    gs.lives--;
                    explode(player.x+player.w/2,player.y+player.h/2,'#00ff88');
                    playSound('hit');
                    updateUI();
                    if(gs.lives<=0) gameOver();
                }
            }
        });

        // Enemies vs player
        enemies.forEach((e,ei) => {
            if(coll(e,player)) {
                explode(e.x+e.w/2,e.y+e.h/2,e.color);
                enemies.splice(ei,1);
                if(gs.powerups.shield>Date.now()) {
                    playSound('shield');
                } else {
                    gs.lives--;
                    playSound('hit');
                    updateUI();
                    if(gs.lives<=0) gameOver();
                }
            }
        });

        // Enemy bullets hit boss (nope) - check enemy bullets vs player done above

        // Enemies reach bottom
        enemies.forEach((e,ei) => {
            if(e.y>canvas.height-30) {
                explode(e.x+e.w/2,canvas.height-30,e.color);
                enemies.splice(ei,1);
                if(gs.powerups.shield<=Date.now()) {
                    gs.lives--;
                    updateUI();
                    if(gs.lives<=0) gameOver();
                }
            }
        });

        // Powerups vs player
        powerups.forEach((p,pi) => {
            if(coll(p,player)) {
                powerups.splice(pi,1);
                if(p.type==='life') {
                    gs.lives = Math.min(gs.lives+1, 5);
                    updateUI();
                } else if(p.type==='bomb') {
                    // Destroy all enemies on screen
                    enemies.forEach(e => { gs.score+=e.points; explode(e.x+e.w/2,e.y+e.h/2,e.color,8); });
                    enemies=[];
                    enemyBullets=[];
                    playSound('bomb');
                } else {
                    gs.powerups[p.type] = Date.now() + p.duration;
                    updatePowerupUI();
                }
                playSound('powerup');
            }
        });
    }

    function levelComplete() {
        gs.playing=false;
        document.getElementById('completeScore').textContent=gs.score;
        document.getElementById('completeLevel').textContent=gs.level+1;
        if(gs.level+1 >= levels.length) {
            document.getElementById('victoryScore').textContent=gs.score;
            document.getElementById('victoryOverlay').classList.add('visible');
        } else {
            document.getElementById('levelCompleteOverlay').classList.add('visible');
        }
        startBtn.disabled=false; pauseBtn.disabled=true;
        playSound('victory');
    }

    // Update
    function update() {
        movePlayer();
        shoot();
        if(shootCooldown>0) { shootCooldown--; if(shootCooldown===0) canShoot=true; }

        // Move bullets
        bullets.forEach((b,i) => { b.y-=b.spd; if(b.dx) b.x+=b.dx; if(b.y<-20||b.x<-20||b.x>canvas.width+20) bullets.splice(i,1); });
        enemyBullets.forEach((b,i) => { b.y+=b.spd; if(b.dx) b.x+=b.dx; if(b.y>canvas.height+20) enemyBullets.splice(i,1); });

        // Move enemies
        enemies.forEach(e => {
            e.y += e.spd;
            e.x += e.dx * (0.5+gs.level*0.1);
            if(e.x<=0 || e.x>=canvas.width-e.w) e.dx*=-1;
        });

        // Move boss
        if(boss) {
            if(boss.y < 40) boss.y += boss.spd;
            else {
                boss.x += boss.dx * 1.5;
                if(boss.x<=0 || boss.x>=canvas.width-boss.w) boss.dx*=-1;
            }
        }

        // Move powerups
        powerups.forEach((p,i) => { p.y+=p.spd; if(p.y>canvas.height+20) powerups.splice(i,1); });

        // Move stars
        stars.forEach(s => { s.y+=s.sp; if(s.y>canvas.height){s.y=0;s.x=Math.random()*canvas.width;} });

        // Spawn
        spawnEnemies();

        // Check if all spawned and none left -> spawn boss
        const lv=levels[gs.level];
        if(!gs.bossActive && !gs.bossDefeated && gs.spawned>=lv.enemies && enemies.length===0) {
            spawnBoss();
        }

        enemyShoot();
        checkCollisions();

        // Particles
        particles = particles.filter(p=>p.life>0);
        particles.forEach(p=>{p.x+=p.dx;p.y+=p.dy;p.life-=0.02;p.r*=0.98;});

        updatePowerupUI();
    }

    // Draw
    function draw() {
        ctx.fillStyle='#0a0a1a';
        ctx.fillRect(0,0,canvas.width,canvas.height);

        // Stars
        stars.forEach(s=>{ctx.fillStyle=`rgba(255,255,255,${0.3+s.sp})`;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();});

        // Player
        ctx.shadowBlur=15; ctx.shadowColor=gs.powerups.shield>Date.now()?'#64c8ff':player.color;
        ctx.fillStyle=gs.powerups.shield>Date.now()?'#64c8ff':player.color;
        ctx.beginPath();
        ctx.moveTo(player.x+player.w/2,player.y);
        ctx.lineTo(player.x+player.w,player.y+player.h);
        ctx.lineTo(player.x,player.y+player.h);
        ctx.closePath();
        ctx.fill();
        if(gs.powerups.shield>Date.now()) {
            ctx.strokeStyle='rgba(100,200,255,0.5)';
            ctx.lineWidth=2;
            ctx.beginPath();ctx.arc(player.x+player.w/2,player.y+player.h/2,30,0,Math.PI*2);ctx.stroke();
        }

        // Bullets
        ctx.shadowColor='#00ffff';
        bullets.forEach(b=>{ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='rgba(0,255,255,0.3)';ctx.fillRect(b.x-2,b.y,b.w+4,b.h+5);});

        // Enemy bullets
        ctx.shadowColor='#ff6b6b';
        enemyBullets.forEach(b=>{ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);});

        // Enemies
        enemies.forEach(e=>{
            ctx.shadowBlur=10;ctx.shadowColor=e.color;ctx.fillStyle=e.color;
            // Different shapes per type
            if(e.type==='basic') {
                ctx.fillRect(e.x+5,e.y,e.w-10,e.h);
                ctx.fillRect(e.x,e.y+5,e.w,e.h-10);
            } else if(e.type==='fast') {
                ctx.beginPath();ctx.moveTo(e.x+e.w/2,e.y);ctx.lineTo(e.x+e.w,e.y+e.h);ctx.lineTo(e.x,e.y+e.h);ctx.closePath();ctx.fill();
            } else if(e.type==='shooter') {
                ctx.beginPath();ctx.arc(e.x+e.w/2,e.y+e.h/2,e.w/2,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#0a0a1a';ctx.fillRect(e.x+e.w/2-6,e.y+e.h/2-2,5,5);ctx.fillRect(e.x+e.w/2+1,e.y+e.h/2-2,5,5);
            } else {
                ctx.fillRect(e.x,e.y,e.w,e.h);
                ctx.fillStyle='#0a0a1a';ctx.fillRect(e.x+4,e.y+4,8,8);ctx.fillRect(e.x+e.w-12,e.y+4,8,8);
            }
            // HP bar for tank/shooter
            if(e.maxHp>1) {
                ctx.fillStyle='#333';ctx.fillRect(e.x,e.y-6,e.w,4);
                ctx.fillStyle=e.color;ctx.fillRect(e.x,e.y-6,e.w*(e.hp/e.maxHp),4);
            }
        });

        // Boss
        if(boss) {
            ctx.shadowBlur=20;ctx.shadowColor=boss.color;ctx.fillStyle=boss.color;
            // Boss shape
            ctx.beginPath();
            ctx.moveTo(boss.x+boss.w/2,boss.y);
            ctx.lineTo(boss.x+boss.w,boss.y+boss.h*0.6);
            ctx.lineTo(boss.x+boss.w*0.8,boss.y+boss.h);
            ctx.lineTo(boss.x+boss.w*0.2,boss.y+boss.h);
            ctx.lineTo(boss.x,boss.y+boss.h*0.6);
            ctx.closePath();
            ctx.fill();
            // Eyes
            ctx.fillStyle='#fff';
            ctx.beginPath();ctx.arc(boss.x+boss.w*0.3,boss.y+boss.h*0.4,6,0,Math.PI*2);ctx.fill();
            ctx.beginPath();ctx.arc(boss.x+boss.w*0.7,boss.y+boss.h*0.4,6,0,Math.PI*2);ctx.fill();
            ctx.fillStyle='#0a0a1a';
            ctx.beginPath();ctx.arc(boss.x+boss.w*0.3,boss.y+boss.h*0.4,3,0,Math.PI*2);ctx.fill();
            ctx.beginPath();ctx.arc(boss.x+boss.w*0.7,boss.y+boss.h*0.4,3,0,Math.PI*2);ctx.fill();
        }

        // Powerups
        ctx.shadowBlur=0;
        powerups.forEach(p=>{
            ctx.fillStyle=p.color;
            ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,p.w/2,0,Math.PI*2);ctx.fill();
            ctx.font='12px Arial';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';
            ctx.fillText(p.label,p.x+p.w/2,p.y+p.h/2);
        });

        // Particles
        particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
        ctx.globalAlpha=1;ctx.shadowBlur=0;
    }

    function gameLoop() {
        if(!gs.playing||gs.paused) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // Sound
    const AC=window.AudioContext||window.webkitAudioContext;
    let audioCtx;
    function initAudio(){if(!audioCtx)audioCtx=new AC();}
    function playSound(type) {
        initAudio();
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);
        const sounds={shoot:{f:880,t:'square',v:0.08},explosion:{f:150,t:'sawtooth',v:0.15},hit:{f:200,t:'square',v:0.1},
            gameover:{f:300,t:'sawtooth',v:0.15},victory:{f:1200,t:'sine',v:0.15},boss:{f:100,t:'sawtooth',v:0.2},
            bosskill:{f:800,t:'sine',v:0.25},powerup:{f:1000,t:'sine',v:0.12},bomb:{f:80,t:'sawtooth',v:0.2},shield:{f:600,t:'sine',v:0.1}};
        const s=sounds[type]||sounds.shoot;
        o.frequency.value=s.f;o.type=s.t;g.gain.value=s.v;
        o.start();g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);o.stop(audioCtx.currentTime+0.15);
    }

    initStars();updateUI();draw();
    </script>
</body>
